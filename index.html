<!-- FILE: index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bhashi Exam System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="portal-page">

<div class="portal-header">
  <div class="portal-header-inner">
    <div class="portal-logo">
      <span class="logo-badge">BHASHI</span>
      <span class="logo-title">Bhashi Exam System</span>
    </div>
  </div>
</div>

<div class="portal-body">

  <div class="portal-hero">
    <h1>Welcome to Bhashi Exam System</h1>
    <p>Choose an exam below to begin. Enter your name when prompted — your timer starts immediately.</p>
  </div>

  <!-- Login form (shown when exam selected) -->
  <div class="login-modal" id="loginModal" style="display:none;">
    <div class="login-modal-card">
      <button class="modal-close" onclick="closeLogin()">✕</button>
      <div class="cambridge-logo">BHASHI</div>
      <h2 id="modalExamTitle">—</h2>
      <p class="modal-meta" id="modalExamMeta">—</p>
      <div class="form-group">
        <label>Your Full Name</label>
        <input type="text" id="studentNameInput" placeholder="e.g. Sarah Ahmed" autocomplete="name">
        <div class="field-error" id="nameErr"></div>
      </div>
      <div class="form-group">
        <label>Class / Group <span class="opt-label">(optional)</span></label>
        <input type="text" id="studentClassInput" placeholder="e.g. Grade 8A">
      </div>
      <button class="btn-primary" onclick="beginExam()">Begin Exam →</button>
    </div>
  </div>
  <div class="modal-backdrop" id="modalBackdrop" style="display:none;" onclick="closeLogin()"></div>

  <!-- Subject filter tabs -->
  <div class="subject-tabs" id="subjectTabs">
    <button class="stab active" data-subject="all" onclick="filterSubject('all',this)">All Exams</button>
  </div>

  <!-- Exam cards grid -->
  <div class="exam-grid" id="examGrid">
    <div class="no-exams-state">
      <div style="font-size:40px; margin-bottom:12px;">📋</div>
      <div style="font-weight:600; margin-bottom:6px;">No exams published yet</div>
      <div style="font-size:13px; color:var(--muted);">Ask your administrator to add exams.</div>
    </div>
  </div>

</div>

<script src="js/storage.js"></script>
<script>
  let allExams = [];
  let selectedExamId = null;

  async function loadExams() {
    // Primary source: shared data/exams.json (same for every browser/device)
    // Fallback: localStorage (for local testing only)
    try {
      const res = await fetch('data/exams.json?t=' + Date.now());
      if (res.ok) {
        const data = await res.json();
        allExams = Array.isArray(data) ? data : [];
      } else {
        allExams = Storage.getExams();
      }
    } catch {
      allExams = Storage.getExams();
    }

    const published = allExams.filter(e => e.published);

    const examSubjects = published.map(e => e.subject).filter(Boolean);
    const storedSubjects = Storage.getSubjects().map(s => s.name);
    const combined = [...new Set([...examSubjects, ...storedSubjects])];

    const tabsEl = document.getElementById('subjectTabs');
    tabsEl.innerHTML = '<button class="stab active" data-subject="all" onclick="filterSubject(\'all\',this)">All Exams</button>';
    combined.forEach(s => {
      tabsEl.innerHTML += `<button class="stab" data-subject="${s}" onclick="filterSubject('${s}',this)">${s}</button>`;
    });

    renderExams(published);
  }

  function filterSubject(subj, btn) {
    document.querySelectorAll('.stab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const published = allExams.filter(e => e.published);
    renderExams(subj === 'all' ? published : published.filter(e => e.subject === subj));
  }

  function renderExams(list) {
    const grid = document.getElementById('examGrid');
    if (!list.length) {
      grid.innerHTML = `<div class="no-exams-state">
        <div style="font-size:40px;margin-bottom:12px;">📋</div>
        <div style="font-weight:600;margin-bottom:6px;">No exams in this category</div>
      </div>`;
      return;
    }

    const subjectColors = {
      'Reading': '#003865', 'Writing': '#7b3f00', 'Listening': '#1a5c3a',
      'Speaking': '#4a1070', 'Maths': '#0a3d62', 'Science': '#0d4f3c'
    };

    grid.innerHTML = list.map(e => {
      const color = subjectColors[e.subject] || '#003865';
      const qCount = (e.questions || []).length;
      const mins = e.duration || 45;
      return `
      <div class="exam-card" onclick="openLogin('${e.id}')">
        <div class="exam-card-stripe" style="background:${color}"></div>
        <div class="exam-card-body">
          <div class="exam-card-subject" style="color:${color}">${e.subject || 'General'}</div>
          <div class="exam-card-title">${e.title}</div>
          <div class="exam-card-desc">${e.description || ''}</div>
          <div class="exam-card-meta">
            <span>⏱ ${mins} min</span>
            <span>📝 ${qCount} questions</span>
          </div>
          <button class="btn-start" style="background:${color}">Start Exam →</button>
        </div>
      </div>`;
    }).join('');
  }

  function openLogin(examId) {
    selectedExamId = examId;
    const exam = allExams.find(e => e.id === examId);
    if (!exam) return;
    document.getElementById('modalExamTitle').textContent = exam.title;
    document.getElementById('modalExamMeta').textContent =
      `${exam.subject || ''} · ${exam.duration || 45} minutes · ${(exam.questions||[]).length} questions`;
    document.getElementById('studentNameInput').value = '';
    document.getElementById('studentClassInput').value = '';
    document.getElementById('nameErr').textContent = '';
    document.getElementById('loginModal').style.display = 'flex';
    document.getElementById('modalBackdrop').style.display = 'block';
    setTimeout(() => document.getElementById('studentNameInput').focus(), 100);
  }

  function closeLogin() {
    document.getElementById('loginModal').style.display = 'none';
    document.getElementById('modalBackdrop').style.display = 'none';
    selectedExamId = null;
  }

  function beginExam() {
    const name = document.getElementById('studentNameInput').value.trim();
    if (!name) {
      document.getElementById('nameErr').textContent = 'Please enter your full name.';
      return;
    }
    const exam = allExams.find(e => e.id === selectedExamId);
    sessionStorage.setItem('studentName', name);
    sessionStorage.setItem('studentClass', document.getElementById('studentClassInput').value.trim() || '—');
    sessionStorage.setItem('examId', selectedExamId);
    sessionStorage.setItem('examData', JSON.stringify(exam));
    sessionStorage.setItem('examStart', new Date().toISOString());
    window.location.href = 'take-exam.html';
  }

  loadExams();
</script>
</body>
</html>
