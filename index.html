<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal | Cambridge Exams</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Exam Portal</h1>
      <p>Select an exam to begin your session</p>
    </header>

    <main id="portal-main">
      <div id="student-login" class="welcome-screen">
        <h2>Welcome Student</h2>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Please enter your details to continue</p>
        
        <form id="login-form">
          <div class="form-group" style="text-align: left;">
            <label class="form-label">Full Name</label>
            <input type="text" id="student-name" class="form-control" required placeholder="e.g. John Smith">
          </div>
          <div class="form-group" style="text-align: left;">
            <label class="form-label">Class / Group</label>
            <input type="text" id="student-class" class="form-control" required placeholder="e.g. Year 10A">
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%;">View Available Exams</button>
        </form>
      </div>

      <div id="exam-selection" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
          <h2 id="student-greeting">Available Exams</h2>
          <button class="btn btn-outline" id="btn-logout" style="padding: 0.5rem 1rem;">Change User</button>
        </div>
        
        <div class="card-grid" id="exams-container">
          <!-- Exams will be injected here via JS -->
        </div>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
