<!-- FILE: results.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Results — Bhashi Exam System</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .results-card-wide { max-width: 700px; }
  .results-header-row {
    display: flex;
    align-items: flex-start;
    gap: 24px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .results-score-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-shrink: 0;
  }
  .results-meta-col {
    flex: 1;
    min-width: 180px;
  }
  .grade-badge {
    display: inline-block;
    background: var(--cambridge-blue);
    color: white;
    font-size: 14px;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 20px;
    margin-bottom: 10px;
  }
  .results-meta-row {
    display: flex;
    justify-content: space-between;
    padding: 7px 0;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  .results-meta-row:last-child { border-bottom: none; }
  .results-meta-row .label { color: var(--muted); }
  .results-meta-row .val { font-weight: 600; color: var(--cambridge-blue); }

  /* Review table */
  .review-table { width:100%; border-collapse:collapse; font-size:13px; margin-bottom:18px; }
  .review-table th { background:var(--cambridge-blue); color:white; padding:9px 12px; text-align:left; font-size:11px; font-weight:700; letter-spacing:0.4px; }
  .review-table td { padding:9px 12px; border-bottom:1px solid var(--border); vertical-align:top; }
  .review-row.correct td { background:#f0faf0; }
  .review-row.wrong td { background:#fff5f5; }
  .review-row.pending td { background:#f0f4ff; }
  .review-row .result-icon { font-size:15px; text-align:center; }
  .review-row .correct-answer { color:var(--correct); font-weight:600; font-size:12px; }
  .review-row .wrong-answer { color:var(--wrong); font-size:12px; }
  .review-section-title { font-family:'Source Serif 4',serif; font-size:16px; font-weight:600; color:var(--cambridge-blue); margin:20px 0 10px; }

  .results-actions { display:flex; gap:12px; flex-wrap:wrap; margin-top:18px; }
  .btn-download { background:var(--accent); color:white; border:none; border-radius:var(--radius); padding:12px 24px; font-size:14px; font-weight:700; font-family:'Inter',sans-serif; cursor:pointer; transition:all 0.2s; }
  .btn-download:hover { opacity:0.88; transform:translateY(-1px); }
  .btn-download:disabled { opacity:0.6; cursor:default; transform:none; }
  .btn-back { background:var(--cambridge-blue); color:white; border:none; border-radius:var(--radius); padding:12px 24px; font-size:14px; font-weight:600; font-family:'Inter',sans-serif; cursor:pointer; transition:all 0.2s; }
  .btn-back:hover { background:var(--cambridge-light); }

  @media (max-width: 480px) {
    .results-header-row { flex-direction: column; align-items: center; }
    .results-meta-col { width: 100%; }
    .review-table { font-size: 11px; }
    .review-table th, .review-table td { padding: 6px 8px; }
  }
</style>
</head>
<body class="results-page">

<div class="results-card results-card-wide">
  <div class="cambridge-logo">BHASHI</div>
  <h2>Exam Complete</h2>
  <div class="student-greeting" id="greeting">Loading…</div>

  <!-- Score summary row -->
  <div class="results-header-row">
    <div class="results-score-col">
      <div class="score-circle">
        <div class="score-number" id="scoreNum">—</div>
        <div class="score-total" id="scoreTotal">out of —</div>
      </div>
    </div>
    <div class="results-meta-col">
      <div id="gradeBadge"></div>
      <div id="metaRows"></div>
    </div>
  </div>

  <!-- Part breakdown -->
  <div class="score-breakdown" id="breakdown"></div>

  <!-- Sheets message -->
  <div id="sheetsMsg" class="submit-notice" style="display:none;"></div>

  <!-- Question-by-question review -->
  <div id="reviewSection"></div>

  <!-- Action buttons -->
  <div class="results-actions">
    <button class="btn-download" id="dlBtn" onclick="downloadReport()">⬇ Download Results (PDF)</button>
    <button class="btn-back" onclick="window.location.href='index.html'">← Back to Exams</button>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/seed.js"></script>
<script>
  const raw = sessionStorage.getItem('lastResult');
  if (!raw) { window.location.href = 'index.html'; }

  const r = JSON.parse(raw);

  document.getElementById('greeting').textContent   = `Well done, ${r.studentName}!`;
  document.getElementById('scoreNum').textContent   = r.correct;
  document.getElementById('scoreTotal').textContent = `out of ${r.total}`;

  // Grade badge
  document.getElementById('gradeBadge').innerHTML =
    `<div class="grade-badge">${r.grade || '—'}</div>`;

  // Meta rows (percentage, time)
  document.getElementById('metaRows').innerHTML = `
    <div class="results-meta-row"><span class="label">Percentage</span><span class="val">${r.pct}%</span></div>
    <div class="results-meta-row"><span class="label">Time Taken</span><span class="val">${r.timeTaken}</span></div>
    <div class="results-meta-row"><span class="label">Exam</span><span class="val" style="font-size:12px;max-width:160px;text-align:right;">${r.examTitle || '—'}</span></div>
  `;

  // Part breakdown
  let bdHtml = '';
  try {
    const bd = JSON.parse(r.breakdown || '{}');
    Object.entries(bd).forEach(([part, v]) => {
      bdHtml += `<div class="breakdown-row">
        <span class="label">${part}</span>
        <span class="val">${v.correct} / ${v.total}</span>
      </div>`;
    });
  } catch {}

  document.getElementById('breakdown').innerHTML = `
    ${bdHtml}
    <div class="breakdown-row"><span class="label">Total Score</span><span class="val">${r.correct} / ${r.total}</span></div>
    <div class="breakdown-row"><span class="label">Percentage</span><span class="val">${r.pct}%</span></div>
    <div class="breakdown-row"><span class="label">Time Taken</span><span class="val">${r.timeTaken}</span></div>
  `;

  // Sheets message
  if (Storage.getSetting('sheetsUrl')) {
    const el = document.getElementById('sheetsMsg');
    el.style.display = 'block';
    el.textContent = '✅ Your result has been sent to your teacher.';
  }

  // Question-by-question review
  if (r.questionsSnapshot) {
    try {
      const questions = JSON.parse(r.questionsSnapshot);
      const answers   = JSON.parse(r.answers || '{}');

      if (questions.length) {
        const rows = questions.map(q => {
          const studentAns = answers[q.number];
          const isShortAns = q.questionType === 'short_answer';
          const isCorrect  = !isShortAns && studentAns === q.answer;

          let studentText = studentAns || '(no answer)';
          let correctText = q.answer || '—';

          if (!isShortAns && q.options && q.options.length) {
            const sOpt = q.options.find(o => o.letter === studentAns);
            const cOpt = q.options.find(o => o.letter === q.answer);
            if (sOpt) studentText = `${studentAns}: ${sOpt.text}`;
            if (cOpt) correctText = `${q.answer}: ${cOpt.text}`;
          }

          const rowCls = isShortAns ? 'pending' : (isCorrect ? 'correct' : 'wrong');
          const icon   = isShortAns ? '📝' : (isCorrect ? '✓' : '✗');
          const answerTdCls = isCorrect ? '' : (isShortAns ? '' : 'wrong-answer');
          const correctTdContent = isShortAns
            ? '<em style="color:var(--muted);font-size:11px;">Manual review</em>'
            : (isCorrect ? '—' : `<span class="correct-answer">${escHtml(correctText)}</span>`);

          return `<tr class="review-row ${rowCls}">
            <td style="font-weight:700;color:var(--cambridge-blue);">${q.number}</td>
            <td style="font-size:12px;">${escHtml(q.question)}</td>
            <td class="${answerTdCls}">${escHtml(studentText)}</td>
            <td>${correctTdContent}</td>
            <td class="result-icon">${icon}</td>
          </tr>`;
        }).join('');

        document.getElementById('reviewSection').innerHTML = `
          <div class="review-section-title">Question Review</div>
          <div style="overflow-x:auto;">
            <table class="review-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Question</th>
                  <th>Your Answer</th>
                  <th>Correct Answer</th>
                  <th style="text-align:center;">✓/✗</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>`;
      }
    } catch(e) {
      // If parsing fails, silently skip review section
    }
  }

  function escHtml(str) {
    return (str||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function downloadReport() {
    const btn = document.getElementById('dlBtn');
    btn.disabled = true;
    btn.textContent = '⏳ Preparing PDF…';

    try {
      // Load jsPDF from CDN
      if (!window.jspdf) {
        await new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
          s.onload = resolve; s.onerror = reject;
          document.head.appendChild(s);
        });
      }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'mm', format: 'a4' });
      const W = 210, M = 14, CW = W - M * 2;
      let y = 0;

      // ── Header bar ──────────────────────────────────────
      doc.setFillColor(0, 56, 101);
      doc.rect(0, 0, W, 22, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(14);
      doc.text('BHASHI EXAM SYSTEM', M, 10);
      doc.setFontSize(9);
      doc.setFont('helvetica', 'normal');
      doc.text('Exam Results Report', M, 17);
      const dateStr = new Date().toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
      doc.text(dateStr, W - M, 10, { align: 'right' });
      doc.text(r.examTitle || '—', W - M, 17, { align: 'right' });
      doc.setTextColor(0, 0, 0);
      y = 30;

      // ── Student info ─────────────────────────────────────
      doc.setFillColor(240, 244, 255);
      doc.roundedRect(M, y, CW, 22, 2, 2, 'F');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
      doc.text(r.studentName || '—', M + 4, y + 8);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
      doc.setTextColor(80, 80, 80);
      doc.text(`Class: ${r.studentClass || '—'}`, M + 4, y + 15);
      doc.text(`Grade: ${r.grade || '—'}`, M + 80, y + 8);
      doc.text(`Time taken: ${r.timeTaken || '—'}`, M + 80, y + 15);
      doc.text(`Score: ${r.correct} / ${r.total}  (${r.pct}%)`, M + 140, y + 8);
      doc.setTextColor(0, 0, 0);
      y += 28;

      // ── Score breakdown ──────────────────────────────────
      try {
        const bd = JSON.parse(r.breakdown || '{}');
        const entries = Object.entries(bd);
        if (entries.length) {
          doc.setFont('helvetica', 'bold'); doc.setFontSize(10);
          doc.setTextColor(0, 56, 101);
          doc.text('Score Breakdown', M, y); y += 5;
          doc.setTextColor(0, 0, 0);
          doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
          entries.forEach(([part, v]) => {
            doc.text(part, M + 2, y);
            doc.text(`${v.correct} / ${v.total}`, M + 80, y);
            y += 5;
          });
          doc.text('Total', M + 2, y);
          doc.setFont('helvetica', 'bold');
          doc.text(`${r.correct} / ${r.total}  —  ${r.pct}%`, M + 80, y);
          doc.setFont('helvetica', 'normal');
          y += 8;
        }
      } catch {}

      // ── Question review table ────────────────────────────
      if (r.questionsSnapshot) {
        try {
          const questions = JSON.parse(r.questionsSnapshot);
          const answers   = JSON.parse(r.answers || '{}');

          if (questions.length) {
            doc.setFont('helvetica', 'bold'); doc.setFontSize(10);
            doc.setTextColor(0, 56, 101);
            doc.text('Question Review', M, y); y += 4;
            doc.setTextColor(0, 0, 0);

            // Table header
            const cols = [10, 80, 45, 45, 12];
            const hdrs = ['#', 'Question', 'Your Answer', 'Correct Answer', ''];
            const rowH = 7;
            doc.setFillColor(0, 56, 101);
            doc.rect(M, y, CW, rowH, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFont('helvetica', 'bold'); doc.setFontSize(8);
            let cx = M + 2;
            hdrs.forEach((h, i) => { doc.text(h, cx, y + 5); cx += cols[i]; });
            doc.setTextColor(0, 0, 0);
            y += rowH;

            questions.forEach((q, qi) => {
              if (y > 270) {
                doc.addPage();
                y = 14;
              }
              const studentAns = answers[q.number];
              const isShortAns = q.questionType === 'short_answer';
              const isCorrect  = !isShortAns && studentAns === q.answer;

              let studentText = studentAns || '(no answer)';
              let correctText = isShortAns ? 'Manual review' : (q.answer || '—');
              if (!isShortAns && q.options && q.options.length) {
                const sOpt = q.options.find(o => o.letter === studentAns);
                const cOpt = q.options.find(o => o.letter === q.answer);
                if (sOpt) studentText = `${studentAns}: ${sOpt.text}`;
                if (cOpt) correctText = `${q.answer}: ${cOpt.text}`;
              }

              // Row background
              if (isShortAns)       doc.setFillColor(240, 244, 255);
              else if (isCorrect)   doc.setFillColor(240, 250, 240);
              else                  doc.setFillColor(255, 245, 245);
              doc.rect(M, y, CW, rowH, 'F');

              doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5);
              const qText  = doc.splitTextToSize(q.question || '', cols[1] - 3);
              const aText  = doc.splitTextToSize(studentText, cols[2] - 3);
              const cText  = doc.splitTextToSize(isCorrect ? '—' : correctText, cols[3] - 3);
              const lineH  = Math.max(qText.length, aText.length, cText.length) * 3.5;
              const rH     = Math.max(rowH, lineH + 2);

              if (qi % 2 === 0 && !isShortAns && !isCorrect) { /* already set */ }

              cx = M + 2;
              doc.setTextColor(0, 56, 101); doc.setFont('helvetica', 'bold');
              doc.text(String(q.number), cx, y + 5); cx += cols[0];
              doc.setTextColor(0, 0, 0); doc.setFont('helvetica', 'normal');
              doc.text(qText, cx, y + 5); cx += cols[1];
              if (!isCorrect && !isShortAns) doc.setTextColor(180, 0, 0);
              doc.text(aText, cx, y + 5); cx += cols[2];
              doc.setTextColor(0, 100, 0);
              doc.text(cText, cx, y + 5); cx += cols[3];
              doc.setTextColor(0, 0, 0);
              const icon = isShortAns ? '~' : (isCorrect ? '✓' : '✗');
              if (isCorrect) doc.setTextColor(0, 120, 0);
              else if (!isShortAns) doc.setTextColor(180, 0, 0);
              doc.text(icon, cx, y + 5);
              doc.setTextColor(0, 0, 0);

              // Row border
              doc.setDrawColor(220, 220, 220);
              doc.rect(M, y, CW, rowH, 'S');
              y += rowH;
            });
          }
        } catch {}
      }

      // ── Footer ────────────────────────────────────────────
      const pages = doc.getNumberOfPages();
      for (let p = 1; p <= pages; p++) {
        doc.setPage(p);
        doc.setFontSize(7.5); doc.setTextColor(160, 160, 160);
        doc.text(`Bhashi Exam System  ·  Page ${p} of ${pages}`, W / 2, 291, { align: 'center' });
        doc.setTextColor(0, 0, 0);
      }

      const safeName = (r.studentName || 'Student').replace(/[^a-z0-9]/gi, '_');
      const safeExam = (r.examTitle   || 'Exam'  ).replace(/[^a-z0-9]/gi, '_');
      doc.save(`${safeExam}_${safeName}_Results.pdf`);

    } catch (e) {
      alert('Could not generate PDF: ' + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '⬇ Download Results (PDF)';
    }
  }
</script>
</body>
</html>
