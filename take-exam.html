<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taking Exam | Cambridge Exams</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="exam-container" style="padding: 1rem;">
    <div class="exam-header">
      <div>
        <h2 id="exam-title-display">Loading Exam...</h2>
        <div class="badge badge-reading" id="exam-subject-display" style="margin-top: 0.5rem;">Subject</div>
      </div>
      <div class="timer" id="exam-timer">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <span id="time-left">00:00</span>
      </div>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
    </div>

    <div id="audio-container" style="display: none; margin-bottom: 2rem; background-color: var(--surface-color); padding: 1.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color); text-align: center;">
      <h3 style="margin-bottom: 1rem; font-size: 1.125rem;">Listening Section Audio</h3>
      <audio id="exam-audio-player" controls style="width: 100%; max-width: 500px;">
        <source id="audio-source" src="" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>
    </div>

    <form id="exam-form">
      <div id="questions-container">
        <!-- Questions injected via JS -->
      </div>
      
      <div style="text-align: right; margin-top: 2rem; margin-bottom: 4rem;">
        <button type="submit" class="btn btn-primary" id="btn-submit-exam" style="padding: 1rem 3rem; font-size: 1.125rem;">Submit Exam</button>
      </div>
    </form>
  </div>

  <!-- Results Modal -->
  <div class="modal-overlay" id="result-modal">
    <div class="modal" style="text-align: center;">
      <div style="margin-bottom: 1.5rem;">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin: 0 auto;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
      </div>
      <h2 style="margin-bottom: 1rem;">Exam Submitted!</h2>
      <p style="color: var(--text-muted); margin-bottom: 2rem;">Your answers have been recorded successfully.</p>
      
      <div style="background-color: var(--bg-color); padding: 1.5rem; border-radius: var(--radius-md); margin-bottom: 2rem;">
        <div style="font-size: 3rem; font-weight: 800; color: var(--primary-color);" id="score-display">0/0</div>
        <div style="font-weight: 600; color: var(--text-muted);">Total Score</div>
      </div>

      <button class="btn btn-primary" onclick="window.location.href='index.html'" style="width: 100%;">Return to Dashboard</button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
