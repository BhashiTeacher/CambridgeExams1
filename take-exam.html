<!-- FILE: take-exam.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Header -->
<div class="exam-header" id="examHeader">
  <div class="exam-header-left">
    <div class="test-name" id="hdrTitle">Loading…</div>
    <div class="student-name" id="hdrStudent"></div>
  </div>
  <div class="timer-box" id="timerDisplay">--:--</div>
</div>

<!-- Body -->
<div class="exam-body" id="examBody">
  <div style="padding:40px; text-align:center; color:var(--muted);">Loading exam…</div>
</div>

<!-- Submit bar -->
<div class="submit-bar">
  <div class="progress-wrap">
    <div class="progress-label" id="progressLabel">0 answered</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>
  <button class="btn-submit" onclick="submitExam()">Submit Exam</button>
</div>

<!-- Time up overlay -->
<div class="overlay" id="timeupOverlay">
  <div class="overlay-card">
    <div class="overlay-icon">⏰</div>
    <h3>Time's Up!</h3>
    <p>Your time has ended. Submitting your answers now.</p>
    <button class="btn-primary" onclick="submitExam(true)">See Results →</button>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/seed.js"></script>
<script>
// ── Guard ────────────────────────────────────────────────────
const studentName  = sessionStorage.getItem('studentName');
const studentClass = sessionStorage.getItem('studentClass') || '—';
const examId       = sessionStorage.getItem('examId');
const examStart    = sessionStorage.getItem('examStart') || new Date().toISOString();

if (!studentName || !examId) { window.location.href = 'index.html'; }

const exam = Storage.getExam(examId);
if (!exam) { window.location.href = 'index.html'; }

// ── State ────────────────────────────────────────────────────
let userAnswers   = {};
let secondsLeft   = (exam.duration || 45) * 60;
let timerInterval = null;
let submitted     = false;

// ── Render Header ────────────────────────────────────────────
document.getElementById('hdrTitle').textContent   = exam.title;
document.getElementById('hdrStudent').textContent = studentName;

// ── Build Exam UI ────────────────────────────────────────────
function buildExam() {
  const body = document.getElementById('examBody');
  let html = '';

  // Group questions by part/section
  const parts = groupByPart(exam.questions || []);

  parts.forEach((part, pi) => {
    html += `<div class="part-banner" style="margin-top:${pi===0?'14px':'22px'}">
      <span class="tag">${part.label}</span>
      <span class="title">${exam.subject || 'Reading & Writing'}</span>
    </div>`;

    if (part.instruction) {
      html += `<div class="section-header">
        <div class="q-range">Questions ${part.range}</div>
        <div class="instruction">${part.instruction}</div>
      </div>`;
    }

    // Reading passage (if any question in this part has passage)
    const passageQ = part.questions.find(q => q.passage);
    if (passageQ) {
      html += buildPassage(passageQ.passage);
    }

    // Questions
    if (part.tableStyle) {
      html += buildTableQuestions(part.questions);
    } else {
      part.questions.forEach(q => {
        if (q.questionType === 'short_answer') {
          html += buildShortAnswerCard(q);
        } else {
          html += buildMCQCard(q);
        }
      });
    }
  });

  body.innerHTML = html;
}

function groupByPart(questions) {
  const parts = {};
  questions.forEach(q => {
    const p = q.part || 'Part 1';
    if (!parts[p]) parts[p] = [];
    parts[p].push(q);
  });

  return Object.entries(parts).map(([label, qs]) => {
    const nums = qs.map(q => q.number);
    const range = `${Math.min(...nums)}–${Math.max(...nums)}`;
    const instruction = qs[0]?.partInstruction || 'For each question, choose the correct answer.';
    const tableStyle  = qs[0]?.tableStyle || false;
    return { label, questions: qs, range, instruction, tableStyle };
  });
}

function buildPassage(passage) {
  if (!passage) return '';
  let inner = '';

  if (passage.people && passage.people.length) {
    inner = passage.people.map((p, i) => `
      <div class="person-section">
        <div class="person-header">
          <div class="person-avatar">${p.name ? p.name[0] : '?'}</div>
          <div>
            <div class="person-name">${p.name}</div>
            <div class="person-hobby">${p.subtitle || ''}</div>
          </div>
        </div>
        <div class="person-text">${p.text}</div>
      </div>
      ${i < passage.people.length - 1 ? '<hr class="passage-divider">' : ''}
    `).join('');
  } else if (passage.text) {
    inner = `<div class="person-text">${passage.text}</div>`;
  }

  return `<div class="reading-passage">
    <div class="passage-header">${passage.title || 'Reading Passage'}</div>
    <div class="passage-body">${inner}</div>
  </div>`;
}

function buildMCQCard(q) {
  const stimulusHtml = buildStimulus(q);
  const optionsHtml = (q.options || []).map(opt => `
    <div class="mcq-option" onclick="selectMCQ(${q.number},'${opt.letter}',this)">
      <span class="option-letter">${opt.letter}</span> ${opt.text}
    </div>`).join('');

  return `<div class="q-card">
    <div class="q-card-inner">
      <div class="q-stimulus">
        <div class="q-number-badge">${q.number}</div>
        ${stimulusHtml}
      </div>
      <div class="q-options">
        <div class="q-question-text">${q.question}</div>
        ${optionsHtml}
      </div>
    </div>
  </div>`;
}

function buildShortAnswerCard(q) {
  const stimulusHtml = buildStimulus(q);
  return `<div class="q-card">
    <div class="q-card-inner">
      <div class="q-stimulus">
        <div class="q-number-badge">${q.number}</div>
        ${stimulusHtml}
      </div>
      <div class="q-options">
        <div class="q-question-text">${q.question}</div>
        <textarea
          class="short-answer-input"
          id="sa_${q.number}"
          placeholder="Write your answer here…"
          oninput="selectShortAnswer(${q.number}, this.value)"
        ></textarea>
      </div>
    </div>
  </div>`;
}

function selectShortAnswer(qNum, value) {
  userAnswers[qNum] = value;
  updateProgress();
}

function buildStimulus(q) {
  if (!q.stimulus) return '';
  const s = q.stimulus;

  if (s.type === 'sign') {
    return `<div class="stimulus-box" style="border:3px solid black;text-align:center;padding:14px;">
      ${s.icon ? `<div style="font-size:28px;margin-bottom:6px;">${s.icon}</div>` : ''}
      ${s.title ? `<div class="sign-title">${s.title}</div>` : ''}
      <div style="font-size:12px;line-height:1.6;">${s.body || ''}</div>
    </div>`;
  }

  if (s.type === 'notice') {
    return `<div class="stimulus-box" style="border:2px solid black;text-align:center;padding:14px;">
      ${s.title ? `<div class="sign-title" style="font-size:16px;">${s.title}</div>` : ''}
      <div style="font-size:12px;line-height:1.6;">${s.body || ''}</div>
    </div>`;
  }

  if (s.type === 'message') {
    return `<div class="stimulus-box" style="border:2px solid black;padding:14px;">
      ${s.from ? `<div class="from-to-row"><label>From:</label><span>${s.from}</span></div>` : ''}
      ${s.to   ? `<div class="from-to-row" style="margin-bottom:10px;"><label>To:</label><span>${s.to}</span></div>` : ''}
      <div style="font-size:12px;line-height:1.65;">${s.body || ''}</div>
    </div>`;
  }

  if (s.type === 'phone') {
    return `<div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="phone-bubble">${s.body || ''}</div>
      <div class="phone-home"></div>
    </div>`;
  }

  if (s.type === 'social') {
    return `<div class="social-post">
      <div class="sp-header">
        <div class="sp-avatar">${(s.author||'?')[0]}</div>
        <div class="sp-name">${s.author || ''}</div>
      </div>
      <div style="font-size:12px;line-height:1.55;">${s.body || ''}</div>
    </div>`;
  }

  if (s.type === 'image' && s.url) {
    return `<img src="${s.url}" style="max-width:100%;border-radius:4px;" alt="Question stimulus">`;
  }

  if (s.type === 'text') {
    return `<div class="stimulus-box" style="border:1px solid var(--border);padding:12px;font-size:13px;line-height:1.6;">${s.body||''}</div>`;
  }

  return '';
}

function buildTableQuestions(questions) {
  const rows = questions.map(q => `
    <div class="table-q-row">
      <div class="table-q-left">
        <div class="q-number-badge">${q.number}</div>
        <div class="table-q-text">${q.question}</div>
      </div>
      <div class="table-q-options">
        ${(q.options||[]).map(o =>
          `<button class="table-opt-btn" onclick="selectTable(${q.number},'${o.letter}',this)">${o.letter}</button>`
        ).join('')}
      </div>
    </div>`).join('');

  const headerOpts = (questions[0]?.options || []).map(o =>
    `<span style="width:34px;text-align:center;">${o.letter}${o.text?`<br><small style="font-weight:400;font-size:9px;">${o.text}</small>`:''}</span>`
  ).join('');

  return `<div class="table-q-card">
    <div class="table-q-header">
      <div>Question</div>
      <div class="table-q-header-options">${headerOpts}</div>
    </div>
    ${rows}
  </div>`;
}

// ── Timer ────────────────────────────────────────────────────
function updateTimer() {
  const m = String(Math.floor(secondsLeft/60)).padStart(2,'0');
  const s = String(secondsLeft%60).padStart(2,'0');
  document.getElementById('timerDisplay').textContent = `${m}:${s}`;
}

function startTimer() {
  updateTimer();
  timerInterval = setInterval(() => {
    secondsLeft--;
    updateTimer();
    if (secondsLeft <= 300) document.getElementById('timerDisplay').classList.add('warning');
    if (secondsLeft <= 0) {
      clearInterval(timerInterval);
      document.getElementById('timeupOverlay').classList.add('active');
    }
  }, 1000);
}

// ── Answering ────────────────────────────────────────────────
function selectMCQ(qNum, letter, el) {
  el.closest('.q-options').querySelectorAll('.mcq-option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  userAnswers[qNum] = letter;
  updateProgress();
}

function selectTable(qNum, letter, el) {
  el.closest('.table-q-options').querySelectorAll('.table-opt-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  userAnswers[qNum] = letter;
  updateProgress();
}

function updateProgress() {
  const total    = (exam.questions||[]).length;
  const answered = Object.keys(userAnswers).filter(k => userAnswers[k] !== '').length;
  const pct      = total ? (answered/total)*100 : 0;
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressLabel').textContent = `${answered} of ${total} answered`;
}

// ── Submit ────────────────────────────────────────────────────
function submitExam(fromTimer = false) {
  if (submitted) return;
  const total    = (exam.questions||[]).length;
  const answered = Object.keys(userAnswers).filter(k => userAnswers[k] !== '').length;

  if (!fromTimer && answered < total) {
    if (!confirm(`${total - answered} question(s) unanswered. Submit anyway?`)) return;
  }

  submitted = true;
  clearInterval(timerInterval);
  document.getElementById('timeupOverlay').classList.remove('active');

  // Score — short_answer questions count in total but are NOT auto-graded
  let correct = 0;
  const breakdown = {};
  (exam.questions||[]).forEach(q => {
    const part = q.part || 'Part 1';
    if (!breakdown[part]) breakdown[part] = { correct:0, total:0 };
    breakdown[part].total++;
    const isShortAnswer = q.questionType === 'short_answer';
    if (!isShortAnswer && userAnswers[q.number] === q.answer) {
      correct++;
      breakdown[part].correct++;
    }
  });

  const pct      = total ? Math.round((correct/total)*100) : 0;
  const elapsed  = (exam.duration||45)*60 - secondsLeft;
  const timeTaken = `${Math.floor(elapsed/60)}m ${elapsed%60}s`;
  const grade    = pct>=80?'Excellent 🌟':pct>=60?'Good 👍':pct>=40?'Keep Practising 📚':'Try Again 💪';

  const result = {
    examId, examTitle: exam.title, examSubject: exam.subject,
    studentName, studentClass, examStart, timeTaken,
    correct, total, pct, grade,
    breakdown: JSON.stringify(breakdown),
    answers: JSON.stringify(userAnswers),
    questionsSnapshot: JSON.stringify(exam.questions || [])
  };

  Storage.saveResult(result);

  // Log to Sheets if configured
  const sheetsUrl = Storage.getSetting('sheetsUrl');
  if (sheetsUrl) {
    fetch(sheetsUrl, { method:'POST', mode:'no-cors',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify(result)
    }).catch(()=>{});
  }

  sessionStorage.setItem('lastResult', JSON.stringify(result));
  window.location.href = 'results.html';
}

// ── Init ──────────────────────────────────────────────────────
buildExam();
updateProgress();
startTimer();
</script>
</body>
</html>
